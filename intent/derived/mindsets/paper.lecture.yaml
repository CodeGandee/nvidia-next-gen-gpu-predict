      additional_notes: "只有对规格预测模型、历史信息截断或关键 GPGPU 机制具有枢纽作用的论文才进入讲义级解释；不得把教学性解释当作额外证据。"
      answer_expectation: "给出相对于 v2 范围和实际检查深度的可审计结论；证据不足时保持未解决，不得用后见信息补齐。"
      required_posture: answer-or-unresolved
      evidence_expectation: "引用来源身份、精确页或节或公式或图表定位、公开时间和适用世代；区分来源陈述、研究解释与预测性外推。"
