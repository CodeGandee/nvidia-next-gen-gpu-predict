  schema_version: isomer-kaoju-mindset-source.v3
  mindset_key: paper.lecture
  purpose: "指导对关键论文开展讲义级深读，为 v2 报告中的独立中文方法章节准备可追溯、可教学的数学与系统证据。"
  applicability:
    actions:
      - ingest-reading-item
      - examine
    source_kinds:
      - paper
      - report
    depths:
      - lecture
self_reflection:
