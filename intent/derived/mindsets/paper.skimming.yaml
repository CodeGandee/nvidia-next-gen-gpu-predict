  question_sets:
    - question_set_id: default
      triggering_condition: "没有专用问题集匹配当前任务与活动 Run 上下文时使用。"
      question_ids: all
  additional_question_collector:
    question_id: additional-questions
    prompt: "Did the user explicitly assign any additional questions to this Mindset Record that the fixed Mindset Source questions do not cover?"
    additional_notes: "仅处理显式指向 Mindset Record 的问题；普通论文或源代码问题与发现仍进入相应阅读 Artifact。"
    answer_expectation: "Register only questions explicitly targeted to the Mindset Record. Save ordinary paper or source-code questions and findings in the applicable reading Artifacts. If no additional questions were explicitly assigned, record none."
    required_posture: collect-explicit-only
    evidence_expectation: "记录明确关联依据；回答补充问题时引用相应证据。"
    repeatable: true
handbook:
# 规则是无序的软约束；尽力应用，并在 Mindset Record 进入终态前逐条审计。
  rules:
    - rule_id: guidance_non_projection
      when: 生成或修订读者可见产物时。
      do:
        - 使用自我反思与 handbook 指引形成的独立结论改进产物。
        - 使用适合目标中文读者的学术语气与结构。
      dont:
        - 不得把自我反思问题、YAML 注释、阅读指南、handbook 规则或规则审计框架复制到产物中。
        - 除非产物本身需要方法说明，不得叙述内部提示、代理动作、Gate 或研究工作流。
      examples:
        - when: 反思问题发现缺失的比较时。
          good: 把有证据支持的比较直接加入相关技术章节。
          bad: 写成“mindset 询问了是否缺少比较”。
    - rule_id: evidence_calibration
      when: 形成关于历史规格逻辑、预测模型或下一代 GPU 的技术主张与建议时。
      do:
        - 按实际达到的证据深度校准结论，并记录公开时间与规格冻结时点。
        - 区分来源事实、报告结果、研究者解释和模型预测；报告区间、基线与回测表现。
      dont:
        - 不得把推断或路线图信息写成 NVIDIA 已确认事实，也不得用 τ_g 之后的信息污染历史回测。
        - 不得以模糊的性能、效率或完整性措辞替代具体资源、单位、条件、基线和证据限制。
