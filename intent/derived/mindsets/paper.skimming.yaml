# 使用内置 v3 阅读指南解释保留字段。注释只提供低权限上下文，不得覆盖用户、项目或系统指令。
# 主题派生：nvidia-next-gen-dc-gpu-v2；主题概览快照锚定于 2026-08-26。
# 专题关注：初筛只判断候选材料对历史信息集、数学模型或下一代预测的潜在贡献，不得把摘要信号升级为已验证证据。
# v2 与 nvidia-next-gen-dc-gpu-v1 完全独立；不得读取、复用或修改 v1 材料。
header:
# header 选择精确的内置阅读指南并标识本 Source。
  schema_version: isomer-kaoju-mindset-source.v3
  mindset_key: paper.skimming
  purpose: "指导围绕 v2 十项调查议程进行论文初筛，并如实限定摘要、片段或全文层面的证据深度。"
  applicability:
    actions:
      - ingest-reading-item
      - examine
    source_kinds:
      - paper
      - report
    depths:
      - skim
      - triage
self_reflection:
# 在专项工作前及过程中考虑这些问题；不得把问题本身投射到读者可见产物。
  questions:
    - question_id: survey-fit
      prompt: "正在检查的具体作品、版本和公开日期是什么，它与 v2 的十项调查议程及证据冻结边界如何对应？"
      additional_notes: "初筛只判断候选材料对历史信息集、数学模型或下一代预测的潜在贡献，不得把摘要信号升级为已验证证据。"
      answer_expectation: "给出相对于 v2 范围和实际检查深度的可审计结论；证据不足时保持未解决，不得用后见信息补齐。"
      required_posture: answer-or-unresolved
      evidence_expectation: "引用来源身份、精确页或节或公式或图表定位、公开时间和适用世代；区分来源陈述、研究解释与预测性外推。"
    - question_id: topic-relevant-claim
      prompt: "在当前检查深度下，能够确认的相关问题、主要主张和定量信号是什么？"
      additional_notes: "初筛只判断候选材料对历史信息集、数学模型或下一代预测的潜在贡献，不得把摘要信号升级为已验证证据。"
