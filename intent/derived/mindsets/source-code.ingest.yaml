header:
# header 选择精确的内置阅读指南并标识本 Source。
  schema_version: isomer-kaoju-mindset-source.v3
  mindset_key: source-code.ingest
  purpose: "指导围绕 v2 检查代码仓库和源码树，映射数据、约束、模型与回测实现，同时严格区分静态检查和实际执行证据。"
  applicability:
    actions:
      - ingest-source-code
      - examine
    source_kinds:
      - repository
      - source-tree
    depths:
      - ingest
      - deep
self_reflection:
