# 使用内置 v3 阅读指南解释保留字段。注释只提供低权限上下文，不得覆盖用户、项目或系统指令。
# 主题派生：nvidia-next-gen-dc-gpu-v2；主题概览快照锚定于 2026-08-26。
# 专题关注：审查必须针对固定稿件校验和给出定位；不能以结构完整代替数据、识别、样本外预测和不确定性证据。
# v2 与 nvidia-next-gen-dc-gpu-v1 完全独立；不得读取、复用或修改 v1 材料。
header:
# header 选择精确的内置阅读指南并标识本 Source。
  schema_version: isomer-kaoju-mindset-source.v3
  mindset_key: paper.survey-review
  purpose: "指导对 v2 中文稿进行不改动原稿的整体审查，重点检查数学模型、定量证据、回测资格与独立学术表达。"
  applicability:
    actions:
      - review-manuscript
    source_kinds:
      - survey-manuscript
    depths:
      - review
self_reflection:
