      additional_notes: "审查必须针对固定稿件校验和给出定位；不能以结构完整代替数据、识别、样本外预测和不确定性证据。"
      answer_expectation: "给出面向 v2 中文稿的明确处理决定，并说明它如何服务于十项调查议程；证据不足时保持未解决。"
      required_posture: answer-or-unresolved
      evidence_expectation: "引用 v2 已接受的证据记录、精确来源定位、公开时间、统一单位以及适用的模型、回测或预测结果；区分事实、推断和预测。"
